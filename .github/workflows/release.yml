name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Linux binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/yurifrl/cly/cmd.Version=${VERSION}" -o dist/cly-linux-$arch .
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/mcp-linux-$arch ./cmd/mcp
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/*

  build-macos-amd64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build macOS amd64 binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          mkdir -p dist
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/yurifrl/cly/cmd.Version=${VERSION}" -o dist/cly-darwin-amd64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/mcp-darwin-amd64 ./cmd/mcp

      - uses: actions/upload-artifact@v4
        with:
          name: macos-amd64-binaries
          path: dist/*

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build macOS arm64 binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          mkdir -p dist
          CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/yurifrl/cly/cmd.Version=${VERSION}" -o dist/cly-darwin-arm64 .
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/mcp-darwin-arm64 ./cmd/mcp

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-binaries
          path: dist/*

  release:
    needs: [build-linux, build-macos-amd64, build-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Prepare release assets
        run: |
          mkdir -p dist
          find dist-all -type f -exec mv {} dist/ \;
          cd dist && sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: CLY ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
