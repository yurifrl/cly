version: '3'

tasks:
  patch:
    desc: Bump patch version (0.1.0 -> 0.1.1)
    cmds:
      - |
        current=$(yq '.app.version' config/config.yaml)
        new=$(echo $current | awk -F. '{printf "%d.%d.%d\n", $1, $2, $3+1}')
        yq -i ".app.version = \"$new\"" config/config.yaml
        echo "Version bumped to $new"

  minor:
    desc: Bump minor version (0.1.0 -> 0.2.0)
    cmds:
      - |
        current=$(yq '.app.version' config/config.yaml)
        new=$(echo $current | awk -F. '{printf "%d.%d.%d\n", $1, $2+1, 0}')
        yq -i ".app.version = \"$new\"" config/config.yaml
        echo "Version bumped to $new"

  major:
    desc: Bump major version (0.1.0 -> 1.0.0)
    cmds:
      - |
        current=$(yq '.app.version' config/config.yaml)
        new=$(echo $current | awk -F. '{printf "%d.%d.%d\n", $1+1, 0, 0}')
        yq -i ".app.version = \"$new\"" config/config.yaml
        echo "Version bumped to $new"
