version: '3'

includes:
  bump: ./taskfiles/bump.yaml

vars:
  VERSION:
    sh: git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "dev"
  BUILD_TIME:
    sh: date -u +%Y%m%d%H%M%S
  BINARY_NAME: cly
  BUILD_DIR: dist

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  nix:vendor-hash:
    desc: Recompute and lock the flake vendorHash (run when go.mod/go.sum change)
    sources:
      - go.mod
      - go.sum
    cmds:
      - bash scripts/update-vendor-hash.sh

  envs:op:
    desc: Process .env.op with 1Password CLI and output to .env (skipped if .env is fresher than .env.op)
    sources:
      - .env.op
    generates:
      - .env
    cmds:
      - op inject -f --account my.1password.com -i .env.op -o .env

  envs:refresh:
    desc: Force-rebuild .env from .env.op (bypasses freshness check)
    cmds:
      - op inject -f --account my.1password.com -i .env.op -o .env

  build:notifier:
    desc: Build embedded macOS notifier bundle (darwin only)
    dotenv: ['.env']
    cmds:
      - bash pkg/notify/swift/build.sh
    sources:
      - pkg/notify/swift/Sources/**/*.swift
      - pkg/notify/swift/Info.plist
      - pkg/notify/swift/build.sh
    generates:
      - pkg/notify/assets/cly-notifier.app.tar.gz

  build:
    desc: Build cly for current platform
    dotenv: ['.env']
    cmds:
      - go build -ldflags="-s -w -X github.com/yurifrl/cly/cmd.Version={{.VERSION}} -X github.com/yurifrl/cly/cmd.BuildTime={{.BUILD_TIME}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}} .
    sources:
      - "**/*.go"
    generates:
      - "{{.BUILD_DIR}}/{{.BINARY_NAME}}"

  build:mcp:
    desc: Build mcp for current platform
    dotenv: ['.env']
    cmds:
      - go build -ldflags="-s -w -X main.version={{.VERSION}}" -o {{.BUILD_DIR}}/mcp ./cmd/mcp
    sources:
      - cmd/mcp/**/*.go
      - modules/mcp/**/*.go
    generates:
      - "{{.BUILD_DIR}}/mcp"

  build:pi:
    desc: Build pi wrapper binary for current platform
    dotenv: ['.env']
    cmds:
      - go build -ldflags="-s -w" -o {{.BUILD_DIR}}/pi ./cmd/pi
    sources:
      - cmd/pi/**/*.go
      - modules/piwrap/**/*.go
    generates:
      - "{{.BUILD_DIR}}/pi"

  build:all:
    desc: Build both cly and mcp
    deps: [build, build:mcp]

  install:
    desc: Install CLI to /usr/local/bin
    aliases: [i]
    cmds:
      - go build -ldflags="-s -w -X github.com/yurifrl/cly/cmd.Version={{.VERSION}} -X github.com/yurifrl/cly/cmd.BuildTime={{.BUILD_TIME}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}} .
      - "{{.BUILD_DIR}}/{{.BINARY_NAME}} update"
  install:mcp:
    desc: Install mcp to /usr/local/bin
    cmds:
      - go build -ldflags="-s -w -X main.version={{.VERSION}}" -o {{.BUILD_DIR}}/mcp ./cmd/mcp
      - sudo mv {{.BUILD_DIR}}/mcp /usr/local/bin/mcp
      - go run ./cmd/mcp completion fish > ~/.cache/fish_completions/mcp.fish

  install:pi:
    desc: Install pi wrapper to /usr/local/bin (with `p` symlink alias)
    cmds:
      - go build -ldflags="-s -w" -o {{.BUILD_DIR}}/pi ./cmd/pi
      - sudo mv {{.BUILD_DIR}}/pi /usr/local/bin/pi
      - sudo ln -sf /usr/local/bin/pi /usr/local/bin/p

  install:all:
    desc: Install both cly and mcp
    deps: [install, install:mcp]

  test:
    desc: Run tests
    cmds:
      - go test ./...

  test:mcp:
    desc: Run MCP tests
    cmds:
      - go test ./modules/mcp/... -v {{.CLI_ARGS}}

  lint:isolation:
    desc: Verify standalone-flavor packages have no forbidden cly imports
    cmds:
      - |
        set -e
        echo "checking pkg/notify..."
        leaks=$(grep -rn "yurifrl/cly" pkg/notify/ --include='*.go' || true)
        if [ -n "$leaks" ]; then
          echo "pkg/notify must not import cly internals:"; echo "$leaks"; exit 1
        fi
        echo "pkg/notify: OK"
      - |
        set -e
        echo "checking modules/every..."
        leaks=$(grep -rn "yurifrl/cly" modules/every/ --include='*.go' \
          | grep -v "yurifrl/cly/modules/every/" \
          | grep -v "yurifrl/cly/pkg/notify" || true)
        if [ -n "$leaks" ]; then
          echo "modules/every: forbidden cly imports:"; echo "$leaks"; exit 1
        fi
        echo "modules/every: OK"

  run:
    desc: Run cly directly with args (use -- for args, e.g., task run -- --help)
    cmds:
      - go run . {{.CLI_ARGS}}

  run:mcp:
    desc: Run mcp directly with args (use -- for args, e.g., task run:mcp -- --help)
    cmds:
      - go run ./cmd/mcp {{.CLI_ARGS}}

  version:
    desc: Show current version
    cmds:
      - git describe --tags --abbrev=0

  worktree:
    desc: Create git worktree in .worktrees/<name>
    cmds:
      - git worktree add .worktrees/{{.CLI_ARGS}} -b {{.CLI_ARGS}}

  ref:init:
    desc: Initialize submodules after clone
    cmds:
      - git submodule update --init --recursive

  ref:update:
    desc: Update submodules to latest
    cmds:
      - git submodule update --remote --merge
