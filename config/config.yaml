app:
  name: cly
  debug: false
  config_dir: ~/.config/cly
  data_dir: ~/.local/share/cly

bundle:
  go_file: ~/.config/Gofile
  js_file: ~/.config/Jsfile
  python_file: ~/.config/Pythonfile
  brew_file: ~/.config/Brewfile

theme:
  style: charm # Options: charm | dracula | catppuccin

notify:
  sound: false
  use_beeep: true
  use_terminal_notifier: true
  use_zellij_status: true
  use_zellij_notify: true
  icon: ""
  types:
    notification:
      title: "🔔 Claude Task"
      subtitle: "Starting"
      message: "New task"
      sound: "Glass"
      group: "claude-task-start"
      zellij_status: "🔔 Task notification"
      zellij_event: "notification"
      hook: "UserPromptSubmit"
    stop:
      title: "✅ Claude Complete"
      subtitle: "Finished"
      message: "Task completed"
      sound: "Blow"
      group: "claude-task-complete"
      zellij_status: "✅ Task completed"
      zellij_event: "stop"
      hook: "Stop"
    posttooluse:
      title: ""
      subtitle: ""
      message: ""
      sound: ""
      group: ""
      zellij_status: ""
      zellij_event: "posttooluse"
      hook: "PostToolUse"
      matcher: "*"
    hook:
      title: "🪝 Claude Hook"
      subtitle: "Triggered"
      message: "Hook event received"
      sound: "Submarine"
      group: "claude-hook"
      zellij_status: "🪝 Hook triggered"
      zellij_event: "hook"
    default:
      title: "📢 Claude"
      subtitle: "Notification"
      message: "Claude notification received"
      sound: "Ping"
      group: "claude-default"
      zellij_status: "📢 Claude notification"
      zellij_event: "default"

modules:
  uuid:
    default_version: v4 # Options: v4 | v7
  demo:
    show_count: true
  dotfiles:
    directory: ~/DotFiles
  backup:
    # GCS bucket for backups (configure in config.local.yaml)
    gcs_bucket: ""
