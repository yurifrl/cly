app:
  name: cly
  debug: false
  config_dir: ~/.config/cly
  data_dir: ~/.local/share/cly
  dotfiles_dir: ~/DotFiles

theme:
  style: charm # Options: charm | dracula | catppuccin

# Repo-wide AI providers. First condition match wins (highest weight,
# ties by list order); otherwise the entry with default: true; otherwise
# the first entry. Modules can override under modules.<name>.ai.
ai:
  providers:
    - name: anthropic          # default fallback
      provider: anthropic
      model: claude-sonnet-4-5-20250929
      api_key: $ANTHROPIC_API_KEY
      default: true
    - name: openai
      provider: openai
      model: gpt-4o-mini
      api_key: $OPENAI_API_KEY
    - name: openrouter         # OpenAI-compatible gateway (base_url preset)
      provider: openrouter
      model: anthropic/claude-3.5-sonnet
      api_key: $OPENROUTER_API_KEY
    - name: bedrock            # Anthropic models via AWS Bedrock
      provider: bedrock
      model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
      # no api_key: uses AWS_BEARER_TOKEN_BEDROCK or AWS creds/profile

modules:
  bundle:
    go_file: ~/.config/cly/bundles/Gofile
    js_file: ~/.config/cly/bundles/packages.json
    js_manager: pnpm # Options: pnpm | npm
    python_file: ~/.config/cly/bundles/Pythonfile
    brew_file: ~/.config/cly/bundles/Brewfile
    rust_file: ~/.config/cly/bundles/Rustfile
  notify:
    enabled: true
    sound: false
    use_zellij_status: true
    use_zellij_notify: true
    icon: ""
    hooks:
      notification:
        enabled: true
        title: "🔔 Claude Task"
        message: "Starting - New task [${ZELLIJ_SESSION_NAME}] ${CLAUDE_SESSION_NAME}"
        sound: "Glass"
        zellij_status: "🔔 Task notification"
        zellij_event: "notification"
      stop:
        enabled: true
        title: "✅ Claude Complete"
        message: "Finished - Task completed [${ZELLIJ_SESSION_NAME}] ${CLAUDE_SESSION_NAME}"
        sound: "Blow"
        zellij_status: "✅ Task completed"
        zellij_event: "stop"
  git-commits:
    ai:
      provider: openai         # Options: openai | anthropic
      model: gpt-4o            # Leave empty for provider default
      # api_key: ""            # Or set OPENAI_API_KEY / ANTHROPIC_API_KEY env var
      # api_key_env: ""        # Custom env var name for API key
    # Gitignore-style patterns. Files matching these are unstaged and
    # skipped unless --ignored is passed. Leading '/' anchors to repo root.
    ignore:
      - "/.pi/"
  uuid:
    default_version: v4 # Options: v4 | v7
  piwrap:
    # Filename prefix for pre-created pi session files. The full name is
    # "<session_file_name_prefix>-<kebab(name)>.jsonl" stored under
    # ~/.pi/agent/sessions/<encoded-cwd>/.
    session_file_name_prefix: cly
    # Session import (--sety session_import.*) defaults.
    session_import:
      # When the target filename already exists, true moves it to
      # quarantine_dir and proceeds; false fails with SETY_IMPORT_CONFLICT.
      override: false
      # Where conflicting target files are moved on override=true.
      quarantine_dir: ~/.local/share/cly/trash/pi-sessions
      # cwd: only look in the current cwd's encoded session dir.
      # all: scan every dir under ~/.pi/agent/sessions/.
      search_scope: cwd-custom-session
  memwatch:
    enabled: true
    interval: 30s              # how often to poll memory_pressure
    threshold_percent: 20      # alert when free RAM %% <= this
    critical_percent: 10       # critical alert when free RAM %% <= this
    cooldown: 5m               # min time between repeat alerts (escalations bypass)
    alert_on_pressure:         # also alert on these macOS pressure levels
      - warn
      - critical
    title: "🧠 Low Memory"
    message: "Free: ${FREE}%% — Pressure: ${PRESSURE}"
    use_cmux: true             # prefer cmux notify + sidebar status when inside cmux
    use_desktop: true          # macOS notification fallback (via beeep)
    use_zellij: false          # also fire zellij notifications
    sound: Basso
    top_n: 5                   # number of top processes to track / show
    process_threshold_mb: 1500 # alert when a single app uses more than this
    process_growth_mb: 500     # alert when a process grows this much since last alert
    include_top_in_alert: true # append top-memory list to alert message
  demo:
    show_count: true
  dotfiles:
    zellij_plugins_dir: ~/.config/zellij/plugins
    op:
      account: ""
    jobs:
      retries:
        enabled: true
        max_attempts: 5
        initial_delay: 2s
        multiplier: 2
        max_delay: 1m
        jitter: true
        reset_after: 10m
  backup:
    # GCS bucket for backups (configure in config.local.yaml)
    gcs_bucket: ""
    # Local directory to sync (supports ~ expansion)
    source_dir: ~/Workdir
    # Path patterns (Python regex) excluded from sync, one per line
    exclude:
      - .*node_modules/.*
      - .*__pycache__/.*
      - .*\.pyc$
      - .*\.DS_Store$
      - .*\._\.DS_Store$
      - .*\.terraform/.*
      - .*\.vscode/.*
      - .*\.npm/.*
      - .*\.yarn/.*
      - .*venv/.*
      - .*\.venv/.*
      - .*env/.*
      - .*\.env/.*
      - .*dist/.*
      - .*build/.*
      - .*target/.*
      - .*bin/.*
      - .*obj/.*
      - .*out/.*
      - .*\.\#.*
      - .*~$
      - .*\.bak$
      - .*\.bkp$
      - .*\.log$
      - .*\.pyo$
      - .*\.pyd$
      - .*\.terragrunt-cache/.*
      - .*\.idea/.*
      - .*\.cache/.*
      - .*\.pytest_cache/.*
      - .*\.mypy_cache/.*
      - .*\.ruff_cache/.*
      - .*coverage/.*
      - .*\.coverage$
      - .*htmlcov/.*
      - .*\.tox/.*
      - .*\.eggs/.*
      - .*\.egg-info/.*
      - .*\.direnv/.*
      - .*tmp/.*
      - .*temp/.*
      - .*\.tmp$
      - .*\.temp$
      - .*\.swp$
      - .*\.swo$
      - .*\.swn$
      - .*\.class$
      - .*\.o$
      - .*\.so$
      - .*\.dylib$
      - .*\.dll$
      - .*\.exe$
  scraper:
    aliexpress:
      browser:
        headless: false
        debug_port: 9222
        user_data_dir: ~/.cly/scraper/chrome
        timeout: 60s
        wait_time: 15s
      reviews_count: 20
      filter_reviews_by: "all"
      output_mode: "single"
      output_dir: "./scraped"
      delay_between_products: 5s
      max_retries: 3
