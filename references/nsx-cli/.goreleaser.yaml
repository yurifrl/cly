version: 2
project_name: nsx
before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
      - goos: linux
        goarch: arm64
    ldflags:
      - -s -w
      - -X 'github.com/NSXBet/nsx-cli/shared/googlex.googleClientID={{ .Env.GOOGLE_CLIENT_ID }}'
      - -X 'github.com/NSXBet/nsx-cli/shared/googlex.googleClientSecret={{ .Env.GOOGLE_CLIENT_SECRET }}'
      - -X main.version={{ .Version }}
    main: ./main.go
    binary: nsx
archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else if eq .Arch "arm64" }}arm64 {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
